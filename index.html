a.chip{color:var(--color-text-accent);border-color:var(--color-border);font-size:.85rem;padding:2px .75em}a.chip:hover{background:var(--color-accent-muted)}

/* ---------- 寫作 ---------- */

.content:has(#t-write){max-width:none;padding-top:20px}

.wr-b.l{height:var(--h-l);padding:0 20px;border-radius:12px;font-size:var(--fz-l)}
.wr-b.s{height:var(--h-s);padding:0 12px;border-radius:8px;font-size:var(--fz-s)}

.wr-b.pri{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent);font-weight:600}.wr-b.pri:hover:not(:disabled){background:var(--color-accent-hover)}
.wr-b.soft{background:var(--color-accent-muted);border-color:transparent;color:var(--color-text-accent);font-weight:600}

.wr-b.danger{color:var(--color-danger);border-color:color-mix(in srgb,var(--color-danger) 40%,var(--color-border))}.wr-b.danger:hover{background:var(--color-danger-muted)}
.wr-b.armed{background:var(--color-danger);border-color:var(--color-danger);color:#fff;width:auto;padding:0 12px}
.wr-in{width:100%;box-sizing:border-box;min-height:0;height:var(--h-m);border:1px solid var(--color-border-strong);border-radius:10px;padding:0 12px;font:inherit;font-size:var(--fz-m);color:var(--color-text-primary);background:var(--color-background-surface)}

.wr-seg{display:inline-flex;align-items:center;height:var(--h-m);box-sizing:border-box;padding:4px;gap:2px;background:var(--color-background-muted);border-radius:12px;flex:none}

.wr-seg button.on{color:var(--color-text-primary);font-weight:600}
.wr-pill{position:absolute;inset:0;border-radius:inherit;background:var(--color-background-surface);box-shadow:0 1px 2px rgba(30,40,30,.14)}
.wr-segt{position:relative;display:inline-flex;align-items:center;gap:6px}
.wr-a{font-family:var(--wr-serif);line-height:1}.wr-a.s{font-size:12px}.wr-a.m{font-size:16px}.wr-a.l{font-size:20px}
.wr-chip-b{display:inline-flex;align-items:center;gap:6px;height:var(--h-s);padding:0 12px;border:0;border-radius:999px;background:var(--color-accent-muted);color:var(--color-text-accent);font:inherit;font-size:14px;cursor:pointer}
.wr-chip-b svg{width:16px;height:16px}
.wr-pillb{height:var(--h-s);padding:0 12px;border:1px solid var(--color-border);border-radius:999px;background:var(--color-background-surface);color:var(--color-text-primary);font:inherit;font-size:var(--fz-s);cursor:pointer}
.wr-pillb.on{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
.wr-chk{display:inline-flex;align-items:center;gap:8px;height:var(--h-m);font-size:var(--fz-m);cursor:pointer}

.wr-line{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}.wr-line.wrap{flex-wrap:wrap;gap:8px}.wr-line .grow,.wr-acts .grow,.wr-tb .grow,.wr-foot .grow,.wr-exp-h .grow,.wr-exp-f .grow{flex:1}

/* header */

/* body */
.wr-body{display:grid;grid-template-columns:264px minmax(0,1fr);gap:16px;align-items:start}

.wr-ed{padding:0;margin:0;display:flex;flex-direction:column;min-height:min(80vh,52rem);overflow:clip;border-radius:16px}
.wr-tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--color-border);position:sticky;top:0;z-index:3;background:var(--color-background-surface)}
.wr-tg{display:flex;gap:2px;align-items:center;padding-right:6px;margin-right:2px;border-right:1px solid var(--color-border)}.wr-tg:last-of-type{border-right:0}
.wr-tool{position:relative;display:inline-grid;place-items:center;width:var(--h-m);height:var(--h-m);padding:0;border:0;border-radius:10px;background:transparent;color:var(--color-text-primary);cursor:pointer;font:inherit}
.wr-tool.l{width:var(--h-l);height:var(--h-l)}
.wr-tool>svg,.wr-tool>span,.wr-tool>ruby{position:relative;z-index:1}
.wr-tool svg{width:20px;height:20px}
.wr-tool:hover:not(:disabled){background:var(--color-background-hover)}
.wr-tool[aria-pressed=true]{color:var(--color-text-accent)}
.wr-tool-on{position:absolute;inset:0;border-radius:inherit;background:var(--color-accent-muted);z-index:0}
.wr-tool:disabled{opacity:.35;cursor:default}
.wr-emi{font-size:16px;text-emphasis:filled dot;-webkit-text-emphasis:filled dot;text-emphasis-position:under right;-webkit-text-emphasis-position:under;line-height:1}
.wr-rubyi{font-size:15px;line-height:1}.wr-rubyi rt{font-size:8px}
.wr-tool.aa{font-weight:700;font-size:16px;background:var(--color-background-muted)}.wr-tool.aa.on{background:var(--color-accent);color:var(--color-on-accent)}

/* page */
.wr-page{width:100%;max-width:920px;margin:0 auto;padding:44px 72px 28px;box-sizing:border-box;font-family:var(--wr-serif);flex:1}
.wr-title{display:block;width:100%;border:0;background:transparent;padding:0;font:700 40px/1.35 var(--wr-serif);color:var(--color-text-primary)}
.wr-tag{display:block;width:100%;border:0;background:transparent;padding:0;margin:6px 0 26px;font:400 15px/1.5 var(--font-family-body);color:var(--color-text-secondary)}
.wr-title:focus,.wr-tag:focus{outline:none}
.wr-title::placeholder,.wr-tag::placeholder{color:color-mix(in srgb,var(--color-text-secondary) 60%,transparent)}
.wr-prose{outline:none;font-family:var(--wr-serif);font-size:calc(22px * var(--wr-fs,1));line-height:var(--wr-lh,2);min-height:20rem;color:var(--wr-ink,var(--color-text-primary));overflow-wrap:anywhere;line-break:strict;counter-reset:fn}
.wr-prose:focus,.wr-prose:focus-visible{outline:none}
.wr-prose p{margin:0 0 var(--wr-ps,.7em);text-align:justify;text-indent:var(--wr-ind,2em)}

.wr-prose h1{font-size:1.4em;margin:1.2em 0 .5em;line-height:1.45}.wr-prose h2{font-size:1.2em;margin:1em 0 .4em}.wr-prose h3{font-size:1.08em;margin:.9em 0 .3em}
.wr-prose blockquote{margin:0 0 var(--wr-ps,.7em);padding:.1em 0 .1em .9em;border-left:3px solid var(--color-border-strong);color:var(--color-text-secondary)}
.wr-prose ul,.wr-prose ol{margin:0 0 var(--wr-ps,.7em);padding-left:1.4em}.wr-prose li p{margin:0}
.wr-prose hr{width:6rem;margin:1.6em auto;border:0;border-top:1px solid var(--color-border-strong)}
.wr-prose a{color:var(--color-text-accent)}
.wr-prose mark{border-radius:3px;padding:0 1px;color:inherit}
.wr-prose .wr-em{text-emphasis:filled dot;-webkit-text-emphasis:filled dot;text-emphasis-position:under right;-webkit-text-emphasis-position:under}
.wr-prose .wr-fnref{counter-increment:fn;cursor:pointer;color:var(--color-text-accent);font-family:var(--font-family-body);font-weight:700;font-size:.6em;padding:0 .12em;border-radius:4px}
.wr-prose .wr-fnref::after{content:counter(fn)}
.wr-prose .wr-fnref:hover,.wr-prose .wr-fnref.ProseMirror-selectednode{background:var(--color-accent-muted)}
.wr-prose ruby{ruby-position:over}.wr-prose rt{font-size:.45em;color:var(--color-text-secondary)}
.wr-prose ruby.ProseMirror-selectednode{background:var(--color-accent-muted);border-radius:4px}
.wr-prose p.is-editor-empty:first-child::before{content:attr(data-placeholder);float:left;height:0;pointer-events:none;color:color-mix(in srgb,var(--color-text-secondary) 60%,transparent);text-indent:0}
.wr-page.wr-v{max-width:none;padding:32px 40px 24px}
.wr-v .wr-prose{min-height:0;min-width:16rem;padding:0 0 4px}
.wr-v .wr-prose blockquote{border-left:0;border-top:3px solid var(--color-border-strong);padding:.9em 0 0}
.wr-v .wr-prose .wr-em{text-emphasis:filled sesame;-webkit-text-emphasis:filled sesame;text-emphasis-position:over right;-webkit-text-emphasis-position:over}
.wr-v .wr-prose ruby{ruby-position:over}
.wr-v .wr-prose .wr-fnref{text-combine-upright:all;-webkit-text-combine:horizontal;font-size:.5em;padding:0;margin:0;line-height:1}
.wr-fns{margin-top:28px;padding-top:12px;border-top:1px solid var(--color-border);font-size:16px;line-height:1.8}
.wr-fns h3{margin:0 0 4px;font:700 13px var(--font-family-body);color:var(--color-text-secondary)}
.wr-fns ol{margin:0;padding-left:1.6em}
.wr-fn-i{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}.wr-fn-i:hover{color:var(--color-text-accent)}
.wr-src{width:100%;box-sizing:border-box;min-height:26rem;font:15px/1.9 var(--font-family-code);background:var(--color-background-body);border:0;border-radius:10px;padding:16px;resize:vertical;color:var(--color-text-primary)}
.wr-foot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 18px;border-top:1px solid var(--color-border);font-size:15px;color:var(--color-text-secondary)}
.wr-foot>span{display:inline-flex;align-items:center;gap:8px}
.wr-foot svg{width:16px;height:16px}
.wr-target{display:inline-flex;align-items:center;gap:10px;height:var(--h-s);padding:0 8px;margin-left:-8px;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;cursor:pointer}
.wr-target:hover{background:var(--color-background-hover)}.wr-target b{color:var(--color-text-primary)}
.wr-bar{width:120px;height:6px;border-radius:3px;background:var(--color-background-muted);overflow:hidden}.wr-bar span{display:block;height:100%;background:var(--color-accent);border-radius:3px}
.wr-saved i{width:9px;height:9px;border-radius:50%;background:var(--color-success)}.wr-saved i.d{background:var(--color-warning)}
.wr-focus .wr-docs{display:none}.wr-focus .wr-body{grid-template-columns:minmax(0,1fr)}
#t-write.wr-focus{background:var(--color-background-body);padding:20px 28px;overflow:auto}

/* menus & popovers */
.wr-msep{height:1px;background:var(--color-border);margin:4px 6px}
.wr-bubble{display:flex;align-items:center;gap:2px;padding:4px;background:var(--color-background-surface);border:1px solid var(--color-border);border-radius:12px;box-shadow:var(--shadow-2)}

.wr-mi{display:flex;align-items:center;justify-content:space-between;height:var(--h-m);padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--color-text-primary);font:inherit;font-size:var(--fz-m);text-align:left;cursor:pointer}

.wr-mi.h1{font-size:20px;font-weight:700}.wr-mi.h2{font-size:18px;font-weight:700}.wr-mi.h3{font-weight:700}.wr-mi.q{color:var(--color-text-secondary);border-left:3px solid var(--color-border-strong);border-radius:0 8px 8px 0}
.wr-swatches{display:flex;flex-wrap:wrap;gap:6px;padding:4px}
.wr-swatches button{width:var(--h-m);height:var(--h-m);border:1px solid var(--color-border);border-radius:10px;background:var(--color-background-surface);color:var(--c);font:700 18px var(--wr-serif);cursor:pointer;display:grid;place-items:center}
.wr-swatches button.hl{background:var(--c)}.wr-swatches button.none{color:var(--color-text-secondary);font-size:18px}
.wr-swatches button.ps{color:var(--color-text-primary)}.wr-swatches button.ps.on{background:var(--color-accent-muted);border-color:var(--color-accent)}
.wr-swatches button:hover{border-color:var(--color-border-strong)}
.wr-fnpop{position:fixed;z-index:95;width:360px;max-width:calc(100vw - 24px);box-sizing:border-box;padding:14px 16px;background:var(--color-background-surface);border:1px solid var(--color-border-strong);border-radius:16px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:10px;font-family:var(--font-family-body)}
.wr-fnpop-h{color:var(--color-text-accent);font-size:14px}
.wr-fnpop textarea{font-family:var(--wr-serif);font-size:17px}

/* dialogs & drawer */
.wr-dlg{border:0;padding:0;background:transparent;max-width:min(560px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 32px);overflow:visible;color:var(--color-text-primary)}
.wr-dlg.wide{max-width:min(1392px,calc(100vw - 32px));height:calc(100dvh - 48px)}
.wr-dlg::backdrop{background:rgba(20,24,20,.45)}
.wr-dlg-in{display:flex;flex-direction:column;gap:12px;height:100%;max-height:calc(100dvh - 32px)}
.wr-dlg-in>.card{margin:0;box-shadow:var(--shadow-2);border-radius:18px;overflow:auto}
.wr-small{display:flex;flex-direction:column;gap:12px;padding:22px 24px}
.wr-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wr-ruby-prev{font-family:var(--wr-serif);font-size:32px;text-align:center;padding:8px 0}.wr-ruby-prev rt{font-size:.45em;color:var(--color-text-secondary)}
.wr-chips{display:flex;gap:6px;flex-wrap:wrap}
.wr-wp{display:flex;flex-direction:column;gap:10px;padding:20px 22px}
.wr-wl{list-style:none;margin:0;padding:0;max-height:50vh;overflow:auto;border:1px solid var(--color-border);border-radius:12px}
.wr-wl li{display:flex;gap:12px;align-items:baseline;min-height:var(--h-m);box-sizing:border-box;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--color-border)}
.wr-wl li:last-child{border-bottom:0}.wr-wl li[aria-selected=true]{background:var(--color-accent-muted)}
.wr-wl li b{font-family:var(--wr-serif);font-size:18px;flex:none}.wr-wl li span{color:var(--color-text-secondary);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr-drawer-wrap{position:fixed;inset:0;z-index:80}
.wr-scrim{position:absolute;inset:0;background:rgba(20,24,20,.3)}
.wr-drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--color-background-surface);border-left:1px solid var(--color-border);box-shadow:-8px 0 32px rgba(20,30,20,.14);display:flex;flex-direction:column}
.wr-dr-h{display:flex;align-items:center;gap:10px;padding:16px 16px 12px 20px;border-bottom:1px solid var(--color-border)}
.wr-dr-h svg:first-child{width:22px;height:22px;color:var(--color-text-accent)}.wr-dr-h h2{flex:1;margin:0;font-size:22px}
.wr-dr-note{display:flex;align-items:center;gap:8px;padding:10px 20px;font-size:14px;color:var(--color-text-secondary);border-bottom:1px solid var(--color-border)}.wr-dr-note svg{width:14px;height:14px}
.wr-dr-list{flex:1;min-height:0;overflow:auto;padding:8px 12px 320px}
.wr-dr-day{font-size:13px;font-weight:700;color:var(--color-text-secondary);padding:12px 8px 4px}
.wr-ver{position:relative;width:100%;display:flex;align-items:center;gap:12px;height:52px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--color-text-primary);font:inherit;text-align:left;cursor:pointer}
.wr-ver:hover{background:var(--color-background-hover)}
.wr-ver>*:not(.wr-ver-pill){position:relative}
.wr-ver-pill{position:absolute;inset:0;border-radius:12px;background:var(--color-accent-muted)}
.wr-ver b{font-size:17px;min-width:52px}.wr-ver-k{flex:1;font-size:14px;color:var(--color-text-secondary)}.wr-ver-d{font-size:14px;font-weight:600;color:var(--color-success)}.wr-ver-d.neg{color:var(--color-danger)}
.wr-dr-cmp{position:absolute;left:16px;right:16px;bottom:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:var(--color-background-surface);border:1px solid var(--color-border);border-radius:16px;box-shadow:0 -4px 24px rgba(20,30,20,.10),0 8px 24px rgba(20,30,20,.12)}
.wr-dr-cmp-h{font-size:14px;color:var(--color-text-secondary)}.wr-dr-cmp-h b{color:var(--color-text-primary);font-size:15px}
.wr-diff{font-family:var(--wr-serif);font-size:16px;line-height:1.9;max-height:150px;overflow:auto;white-space:pre-wrap}
.wr-diff .ins{background:var(--color-success-muted);color:var(--color-success)}.wr-diff .del{background:var(--color-danger-muted);color:var(--color-danger);text-decoration:line-through}.wr-diff .gap{color:var(--color-text-secondary)}
.wr-dr-cmp .wr-acts>.wr-b{flex:1}

/* export */
.wr-exp{padding:0;display:flex;flex-direction:column;height:100%}
.wr-exp-h{display:flex;align-items:center;gap:12px;padding:14px 20px 14px 24px;border-bottom:1px solid var(--color-border)}
.wr-exp-h h2{margin:0;font-size:22px}
.wr-exp-b{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,720px) minmax(0,1fr)}
.wr-exp-opts{overflow:auto;padding:20px 24px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px 12px;align-items:center;align-content:start;border-right:1px solid var(--color-border)}
.wr-lab{font-size:14px;font-weight:600;color:var(--color-text-secondary)}.wr-lab.top{align-self:start;padding-top:10px}
.wr-exp-opts .wr-seg{justify-self:start}
.wr-fonts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wr-font{height:64px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 12px;border:1px solid var(--color-border);border-radius:10px;background:var(--color-background-surface);color:var(--color-text-primary);cursor:pointer;font:inherit}
.wr-font span{font-size:20px;line-height:1.3}.wr-font small{font-size:13px;color:var(--color-text-secondary)}
.wr-font.on{background:var(--color-accent-muted);border-color:var(--color-accent)}
.wr-sig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wr-at{position:relative;display:block}.wr-at>span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-text-secondary);pointer-events:none}.wr-at input{padding-left:30px}
.wr-sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--color-border-strong)}
.wr-exp-prev{background:var(--color-background-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;min-height:0;overflow:hidden}
.wr-spread{position:relative;display:flex;justify-content:center;align-items:center;width:100%;min-height:calc(var(--pw) * var(--ratio))}
.wr-spread-in{display:flex;gap:20px;justify-content:center}.wr-spread.rtl .wr-spread-in{flex-direction:row-reverse}.wr-dots.rtl{flex-direction:row-reverse}
.wr-spread img{width:var(--pw);height:auto;border-radius:4px;box-shadow:0 8px 24px rgba(20,30,20,.18);background:#fff}
.wr-dots{display:flex;gap:4px}
.wr-dots button{width:32px;height:32px;border:0;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.wr-dots span{display:block;width:10px;height:10px;border-radius:5px;background:var(--color-border-strong)}.wr-dots span.on{width:24px;background:var(--color-accent)}
.wr-htmlprev{background:#fff;color:#2a2520;font-size:15px;line-height:1.9;padding:22px 26px;border-radius:6px;box-shadow:var(--shadow-1);width:100%;max-width:520px;max-height:100%;overflow:auto;box-sizing:border-box}
.wr-htmlprev h1{font-size:22px;margin:0 0 12px}.wr-htmlprev p{margin:0 0 .6em;text-indent:2em}
.wr-exp-f{display:flex;gap:12px;align-items:center;padding:14px 24px;border-top:1px solid var(--color-border)}

/* lock & settings */
.wr-lock{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1080px;margin:16px auto}
.wr-lockcard{display:flex;flex-direction:column;align-items:center;gap:16px;padding:48px 40px;margin:0;border-radius:20px;text-align:center;min-height:440px}
.wr-lockcard h1{margin:0;font:700 28px var(--wr-serif)}
.wr-lockicon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--color-accent-muted);color:var(--color-text-accent)}.wr-lockicon svg{width:30px;height:30px}
.wr-lockform{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.wr-warn{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--color-warning)}.wr-warn svg{width:16px;height:16px}
.wr-set{display:flex;flex-direction:column;gap:18px;padding:28px 30px;margin:0;border-radius:20px;height:100%;box-sizing:border-box}
.wr-set .wr-h2{margin:0}
.wr-facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px}
.wr-facts li{display:flex;align-items:center;gap:10px}.wr-facts svg{width:18px;height:18px;color:var(--color-text-accent)}
.wr-rows{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--color-border);padding-top:16px}
.wr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:var(--fz-m)}
.wr-set .wr-acts{margin-top:auto}
.wr-cp{display:grid;grid-template-columns:1fr;gap:8px;overflow:hidden}

/* mobile bottom bar & format panel */
.wr-mbar-wrap{position:fixed;left:0;right:0;z-index:45;padding:0 0 env(safe-area-inset-bottom,0px);pointer-events:none}
.wr-mbar-wrap>*{pointer-events:auto}
.wr-mbar{display:flex;gap:2px;align-items:center;padding:6px 8px;background:var(--color-background-surface);border-top:1px solid var(--color-border);overflow-x:auto}
.wr-mbar .done{height:var(--h-m);padding:0 14px}
.wr-panel{background:var(--color-background-surface);border-top:1px solid var(--color-border);box-shadow:0 -8px 24px rgba(20,30,20,.12);padding:12px;display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;box-sizing:border-box}
.wr-panel-para{flex:none}
.wr-panel-para{display:flex;gap:6px;overflow-x:auto}
.wr-chipp{flex:none;display:inline-flex;align-items:center;gap:6px;height:var(--h-s);padding:0 14px;border-radius:999px;border:1px solid var(--color-border);background:var(--color-background-surface);font:inherit;font-weight:700;color:var(--color-text-primary)}
.wr-chipp svg{width:16px;height:16px}.wr-chipp.clr{font-weight:500;color:var(--color-text-secondary)}
.wr-chipp.on{border-color:var(--color-accent);background:var(--color-accent-muted);color:var(--color-text-accent)}
.wr-panel-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:4px 0 8px}
.wr-acc{border-top:1px solid var(--color-border)}
.wr-acc-h{display:flex;align-items:center;gap:10px;width:100%;height:var(--h-m);padding:0 4px;border:0;background:transparent;color:var(--color-text-primary);font:inherit;font-size:var(--fz-m);font-weight:600;cursor:pointer}
.wr-acc-h svg{width:18px;height:18px;color:var(--color-text-accent)}.wr-acc-h span:not(.wr-acc-c){flex:1;text-align:left}.wr-acc-c{display:grid;place-items:center}.wr-acc-c svg{color:var(--color-text-secondary)}
.wr-acc-b{overflow:hidden}
.wr-panel-row .wr-tool{width:100%;height:var(--h-m)}
.wr-panel-row .wr-tool{background:var(--color-background-body)}

@media(max-width:1199px){.wr-body{grid-template-columns:minmax(0,1fr)}
  .wr-docs{position:static}.wr-docs-toggle{display:flex;align-items:center;gap:8px;width:100%;height:var(--h-m);border:0;background:transparent;color:var(--color-text-primary);font:inherit;cursor:pointer;padding:0 4px}
  .wr-docs-toggle span{flex:1;text-align:left;font-family:var(--wr-serif);font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wr-docs-toggle svg{width:18px;height:18px}.wr-docs-toggle svg:last-child{transition:transform var(--duration-normal)}.wr-docs.open .wr-docs-toggle svg:last-child{transform:rotate(180deg)}
  .wr-docs:not(.open) .wr-docs-in{display:none}.wr-docs.open .wr-docs-in{margin-top:10px}
  .wr-exp-b{grid-template-columns:minmax(0,1fr)}.wr-exp-opts{border-right:0;border-bottom:1px solid var(--color-border)}.wr-exp-prev{min-height:420px}}
@media(max-width:899px){
  .content:has(#t-write){padding:12px 12px calc(var(--bottomnav-h) + 72px)}
  .wr-ph{gap:8px}.wr-ph h1{font-size:24px;line-height:var(--h-m);width:100%}
  .wr-ph .wr-acts{width:100%;gap:6px}
  .wr-ph .wr-seg.l{height:var(--h-m)}.wr-ph .wr-seg.l button{font-size:15px;padding:0 10px}
  .wr-ph .wr-b.l{height:var(--h-m);font-size:15px;padding:0 12px}.wr-ph .wr-b.l.icon{width:var(--h-m);padding:0}
  .wr-hide-s{display:none}
  .wr-page{padding:22px 18px 16px}
  .wr-title{font-size:28px}
  .wr-prose{font-size:calc(19px * var(--wr-fs,1));min-height:14rem}
  .wr-foot{gap:6px 12px;padding:8px 12px;font-size:14px}.wr-engine,.wr-enc{display:none!important}
  .wr-lock{grid-template-columns:minmax(0,1fr)}.wr-lockcard{min-height:0;padding:32px 20px}
  .wr-dlg.wide{max-width:100vw;width:100vw;height:auto;max-height:94dvh;margin:auto auto 0}
  .wr-dlg.wide .wr-dlg-in>.card{border-radius:20px 20px 0 0}
  .wr-exp-opts{grid-template-columns:minmax(0,1fr);gap:6px 0;padding:16px}.wr-lab.top{padding-top:0}.wr-lab{margin-top:8px}
  .wr-fonts{grid-template-columns:repeat(2,minmax(0,1fr))}.wr-sig{grid-template-columns:minmax(0,1fr)}
  .wr-exp-b{display:flex;flex-direction:column-reverse}.wr-exp-prev{min-height:0;padding:14px}
  .wr-exp-prev{flex:none;height:300px;gap:6px;justify-content:flex-start}.wr-spread{min-height:0;flex:1}.wr-spread-in{gap:12px}.wr-spread img{width:auto;height:220px}
  .wr-focus-b{display:none!important}
  .wr-exp-h h2{font-size:18px}.wr-exp-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}.wr-exp-f>.mu{display:none}
  .wr-drawer{width:100vw}
  .wr-fnpop{left:12px!important;right:12px;width:auto}
  body.wr-typing .bottomnav{display:none}
}

/* 寫作：深色時正文再柔和一點；紙張色 */
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #t-write{--wr-ink:#babfb8}}
:root[data-theme="dark"] #t-write{--wr-ink:#babfb8}
#t-write.wr-paper .wr-ed{background:#f6f0e2;border-color:#e4dac4}#t-write.wr-paper .wr-tb{background:#f6f0e2}#t-write.wr-paper{--wr-ink:#3a332a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #t-write.wr-paper .wr-ed,:root:not([data-theme="light"]) #t-write.wr-paper .wr-tb{background:#25221d;border-color:#38332b}:root:not([data-theme="light"]) #t-write.wr-paper{--wr-ink:#c4b9a6}}
:root[data-theme="dark"] #t-write.wr-paper .wr-ed,:root[data-theme="dark"] #t-write.wr-paper .wr-tb{background:#25221d;border-color:#38332b}:root[data-theme="dark"] #t-write.wr-paper{--wr-ink:#c4b9a6}
.shell .railtheme{display:none}.shell.rail .railtheme{display:grid;margin-top:auto}

/* 休息提醒 */
.wr-rest{position:fixed;right:24px;bottom:24px;z-index:96;width:340px;max-width:calc(100vw - 24px);box-sizing:border-box;padding:16px 18px;border-radius:16px;background:var(--color-background-surface);border:1px solid var(--color-border);box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:12px;font-size:var(--fz-m)}
.wr-rest b{display:flex;align-items:center;gap:8px;font-size:17px}.wr-rest b svg{width:20px;height:20px;color:var(--color-text-accent)}
.wr-break{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:color-mix(in srgb,var(--color-background-body) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.wr-break-in{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding:24px}
.wr-breath{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--color-accent-muted) 0%,color-mix(in srgb,var(--color-accent) 30%,transparent) 70%);display:grid;place-items:center;font:600 40px var(--font-family-body);color:var(--color-text-accent);font-variant-numeric:tabular-nums}
.wr-break-in p{margin:0;color:var(--color-text-secondary);font-size:17px;line-height:1.8}
@media(max-width:899px){.wr-rest{right:12px;left:12px;width:auto;bottom:calc(var(--bottomnav-h) + 16px)}}
.wr-label{width:120px!important;flex:none}
.wr-check{width:20px;height:20px;margin:0;accent-color:var(--color-accent)}

/* ===== 40.3 寫作：整頁不捲動、只在編輯區內捲動 ===== */
.content:has(.wr-body){height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;padding-bottom:16px;overflow:hidden}
.content:has(.wr-body) div:has(#t-write){display:flex;flex-direction:column;flex:1;min-height:0}
#t-write{flex:1;min-height:0;display:flex;flex-direction:column}
#t-write .wr-body{flex:1;min-height:0;align-items:stretch}
#t-write .wr-docs{position:static;min-height:0;overflow:auto;scrollbar-width:thin}
#t-write .wr-docs-in{min-height:100%}
#t-write .wr-docs .wr-tip{margin-top:auto}
#t-write .wr-ed{min-height:0}
.wr-scroll{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;overscroll-behavior:contain;scroll-padding:48px 0}
.wr-scroll.v{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden}
.wr-page.wr-v{writing-mode:vertical-rl;height:auto;width:auto;max-width:none;max-height:none;margin:0;padding:36px 44px 24px;flex:none;text-align:start}
.wr-v .wr-vtitle,.wr-v .wr-vtag{text-align:start;align-self:start}
.wr-v .wr-edwrap{min-height:0}
.wr-vtitle{font:700 34px/1.5 var(--wr-serif);color:var(--color-text-primary);margin:0 0 0 6px;outline:none;max-height:100%;letter-spacing:.06em}
.wr-vtag{font:400 15px/1.6 var(--font-family-body);color:var(--color-text-secondary);margin:0 0 0 28px;outline:none;letter-spacing:.08em}
.wr-vtitle.empty::before,.wr-vtag.empty::before{content:attr(data-ph);color:color-mix(in srgb,var(--color-text-secondary) 60%,transparent);pointer-events:none}
.wr-keys-b{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:inherit;font:inherit;padding:4px 0;cursor:pointer}.wr-keys-b:hover{color:var(--color-text-primary)}.wr-keys-b svg{width:16px;height:16px}
/* 註腳摺疊條 */
.wr-fnbar{border-top:1px solid var(--color-border);flex:none}
.wr-fnbar-h{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 18px;border:0;background:transparent;color:var(--color-text-secondary);font:600 14px var(--font-family-body);cursor:pointer}
.wr-fnbar-h:hover{color:var(--color-text-primary)}.wr-fnbar-h .grow{flex:1}.wr-fnbar-h svg{width:16px;height:16px}
.wr-fnbar ol{margin:0;padding:0 18px 10px 2.6em;max-height:28vh;overflow:auto;font:16px/1.7 var(--wr-serif);scrollbar-width:thin}
.wr-fn-i{border:0;background:transparent;padding:2px 4px;margin:0 -4px;border-radius:6px;color:var(--wr-ink,var(--color-text-primary));font:inherit;text-align:left;cursor:pointer}.wr-fn-i:hover{background:var(--color-background-hover)}
/* 快捷鍵 */
.wr-keys{padding:20px 22px 22px}
.wr-keys h3{margin:14px 0 6px;font:700 13px var(--font-family-body);color:var(--color-text-secondary)}
.wr-keys dl{margin:0;display:grid;gap:2px}
.wr-keys dl>div{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:34px;border-bottom:1px solid var(--color-border)}
.wr-keys dd{margin:0;color:var(--color-text-secondary);font-size:15px}
.wr-keys dt{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.wr-keys kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border:1px solid var(--color-border-strong);border-bottom-width:2px;border-radius:6px;background:var(--color-background-body);font:600 12px var(--font-family-body)}
/* 手機：底部抽屜 */
.wr-dlg.wr-bsheet{margin:auto auto 0;max-width:100vw;width:100vw}
.wr-dlg.wr-bsheet .wr-dlg-in>.card{border-radius:20px 20px 0 0;max-height:80dvh}
.wr-sheet{display:flex;flex-direction:column;gap:12px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.wr-sheet .wr-list{max-height:none}
.wr-mmore .wr-seg{width:100%}.wr-mmore .wr-seg button{flex:1}
.wr-mmore-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.wr-mmore-acts .wr-b{justify-content:flex-start}
.wr-mmore-st{display:flex;align-items:center;gap:6px;margin:2px 0 0;font-size:13px;color:var(--color-text-secondary)}.wr-mmore-st svg{width:14px;height:14px}
@media(min-width:900px) and (max-width:1199px){#t-write .wr-body{grid-template-columns:220px minmax(0,1fr)}}
@media(max-width:899px){
  .content:has(.wr-body){padding:8px 8px calc(var(--bottomnav-h) + 60px + env(safe-area-inset-bottom,0px))}
  .content:has(#t-write.typing .wr-body),.content:has(#t-write.nobar .wr-body){padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .content:has(#t-write.nobar:not(.typing) .wr-body){padding-bottom:calc(var(--bottomnav-h) + 8px + env(safe-area-inset-bottom,0px))}
  #t-write .wr-body{grid-template-columns:minmax(0,1fr);gap:0}
  #t-write .wr-ed{border-radius:14px}
  #t-write .wr-foot{display:none}
  #t-write.typing .wr-scroll{padding-bottom:var(--wr-kb)}
  .wr-mbar-wrap{bottom:calc(var(--bottomnav-h) + env(safe-area-inset-bottom,0px))}
  .wr-mbar-wrap:not([style*="bottom"]) .wr-mbar{border-bottom:1px solid var(--color-border)}
  .wr-mh{display:flex;align-items:center;gap:6px;margin:0 0 8px}
  .wr-mh-doc{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:var(--h-m);border:0;background:transparent;color:var(--color-text-primary);padding:0 4px;text-align:left;font:inherit;cursor:pointer}
  .wr-mh-doc>span{min-width:0;display:flex;flex-direction:column;line-height:1.2}
  .wr-mh-doc b{font:700 17px var(--wr-serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wr-mh-doc small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary)}
  .wr-mh-doc .dot{width:6px;height:6px;border-radius:50%;background:var(--color-success)}.wr-mh-doc .dot.d{background:var(--color-warning,#c98a1b)}
  .wr-mh-doc>svg{width:18px;height:18px;flex:none;color:var(--color-text-secondary)}
  .wr-page{padding:18px 16px 16px}
  .wr-page.wr-v{padding:18px 16px 12px}
  .wr-vtitle{font-size:26px}
  .wr-fnbar-h{padding:0 14px}
}
/* ⋯ 更多 */
.wr-more{display:flex;flex-direction:column;gap:4px;width:232px;padding:2px}
.wr-more>.wr-swatches{justify-content:space-between;border-bottom:1px solid var(--color-border);padding-bottom:8px;margin-bottom:2px}
.wr-more>.wr-swatches .wr-tool{width:var(--h-m);height:var(--h-m)}
.wr-more-row{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:4px;padding:0 0 0 6px}
.wr-more-row>span{font-size:13px;color:var(--color-text-secondary)}
.wr-more-row .wr-swatches{padding:2px 0;gap:4px;flex-wrap:nowrap}
.wr-more-row .wr-swatches button{flex:1;width:auto}
.wr-swatches button.num{font:600 14px var(--font-family-body);color:var(--color-text-primary);white-space:nowrap}
.wr-swatches button.num.on{background:var(--color-accent-muted);border-color:var(--color-accent)}
.wr-more-row .wr-seg{width:100%}.wr-more-row .wr-seg button{flex:1}
.wr-more .wr-mi{margin-top:4px;border-top:1px solid var(--color-border);border-radius:0 0 8px 8px;padding-top:6px}
.wr-mi kbd{font:600 12px var(--font-family-body);color:var(--color-text-secondary);border:1px solid var(--color-border);border-radius:6px;padding:1px 6px}
@media(max-width:899px){
  .shell:has(.wr-body) .topbar{display:none}
  .content:has(.wr-body){padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .wr-dlg.wr-bsheet{max-height:none}
}
.wr-chip-b{white-space:nowrap;flex:none}

/* 匯出視窗：佔視窗約 9 成，預覽填滿右邊 */
@media(min-width:900px){
  .wr-dlg.wide{max-width:none;width:92vw;height:92dvh;max-height:92dvh}
  .wr-exp-b{grid-template-columns:clamp(440px,32vw,580px) minmax(0,1fr)}
  .wr-exp-prev{justify-content:flex-start;padding:18px;position:relative}
  .wr-spread{flex:1;min-height:0}
  .wr-spread img{cursor:zoom-in}
}
.wr-zoom{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--color-background-muted);cursor:zoom-out}
.wr-zoom img{max-width:100%;max-height:100%;min-height:0;min-width:0;object-fit:contain;box-shadow:0 10px 30px rgba(0,0,0,.25);border-radius:4px}
.wr-zoom-n{position:absolute;top:12px;left:16px;font-size:14px;color:var(--color-text-secondary)}
.wr-zoom-p,.wr-zoom-nx{position:absolute;top:50%;transform:translateY(-50%);font-size:26px!important;line-height:1}
.wr-zoom-p{left:12px}.wr-zoom-nx{right:12px}
#t-write .wr-ed{position:relative}
.wr-toast{position:absolute;right:16px;bottom:62px;z-index:6;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--color-background-surface);border:1px solid var(--color-border);box-shadow:var(--shadow-2);font-size:14px;color:var(--color-text-secondary);pointer-events:none}
.wr-toast svg{width:16px;height:16px;color:var(--color-success)}
@media(max-width:899px){.wr-toast{bottom:12px;right:12px}}
.wr-pg{position:relative;display:block;padding:0;border:0;background:transparent;cursor:zoom-in;border-radius:4px}
.wr-pg img{display:block}
.wr-pg-z{position:absolute;right:10px;bottom:10px;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(20,24,20,.6);color:#fff;opacity:0;transition:opacity var(--duration-normal)}
.wr-pg:hover .wr-pg-z,.wr-pg:focus-visible .wr-pg-z{opacity:1}.wr-pg-z svg{width:18px;height:18px}
@media(hover:none){.wr-pg-z{opacity:.85}}
@media(min-width:900px){.wr-dlg.wide{width:calc(100vw - 24px);height:calc(100dvh - 24px);max-height:calc(100dvh - 24px)}.wr-dlg.wide .wr-dlg-in{max-height:none}}
img.logo{object-fit:cover;background:var(--color-background-muted)!important;display:block}
.brand b{white-space:nowrap;display:block;font-size:.95rem;letter-spacing:-.01em}

/* =====================================================================
   v41.2 尺寸規範（全站）：大 L／中 M／小 S
   電腦 48／40／32px，手機 52／44／36px（與寫作分頁相同）
   L：一般按鈕、輸入框、下拉選單、分段選擇、搜尋框、側欄項目
   M：.sm 按鈕、次要分段選擇（統計列、側欄外觀）、表格內的小選單
   S：小型圖示鍵（.xs）
   ===================================================================== */
:root{--h-l:48px;--h-m:40px;--h-s:32px;--size-element-lg:var(--h-l);--size-element-md:var(--h-m);--size-element-sm:var(--h-s)}
@media(max-width:899px){:root{--h-l:52px;--h-m:44px;--h-s:36px}}
button.b,a.b,label.b{min-height:var(--h-l);height:var(--h-l);padding:0 1rem}
button.b.lg{min-height:var(--h-l);height:var(--h-l)}
button.b.sm,a.b.sm,label.b.sm{min-height:var(--h-m);height:var(--h-m);padding:0 .75rem}
button.b.xs,a.b.xs{min-height:var(--h-s);height:var(--h-s);padding:0 .5rem;font-size:var(--text-xs)}
button.b.icon{width:var(--h-l);padding:0}button.b.sm.icon{width:var(--h-m)}button.b.xs.icon{width:var(--h-s)}
:is(input[type=text],input[type=search],input[type=number],input[type=date],input.search,select):not(.wr-in):not(.wr-sel){min-height:var(--h-l);height:var(--h-l);padding-top:0;padding-bottom:0}
textarea{min-height:calc(var(--h-l) * 2)}
.searchbox input{min-height:var(--h-l);height:var(--h-l)}
.cb input{min-height:var(--h-l);height:var(--h-l)}
.sortsel select{min-height:var(--h-l);height:var(--h-l)}
input[type=file]::file-selector-button{height:var(--h-m);padding:0 .875rem}
.seg{height:var(--h-l);box-sizing:border-box;align-items:stretch}
.seg button{min-height:0;height:auto}
.gstat .seg,.sidenav .seg,.sheet .seg{height:var(--h-m)}
.gstat .seg button{min-height:0}
.navi{min-height:var(--h-l)}
.sheet .navi{min-height:var(--h-l)}
/* 寫作分頁的 .wr-* 控制項用同一組 --h-l/m/s，各自指定大小 */
.gstat .sortsel select,.gstat select{min-height:var(--h-m);height:var(--h-m)}
.addw{margin-bottom:var(--spacing-4)}
.addw-g{display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-3)}
.addw-g label{display:flex;flex-direction:column;gap:6px;min-width:0}.addw-g label.full{grid-column:1/-1}
.addw-g label>span{font-size:var(--text-sm);font-weight:600;color:var(--color-text-secondary)}
.addw .toolbar{margin-top:var(--spacing-3);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:899px){.addw-g{grid-template-columns:1fr}}
/* 公開網站：詞庫解鎖 */
.vgate{max-width:30rem;margin:var(--spacing-6) auto;display:flex;flex-direction:column;gap:var(--spacing-3);text-align:center;padding:var(--spacing-8) var(--spacing-6)}
.vgate h2{margin:0;font-size:1.3rem}.vgate p{margin:0}
.vgate-ic{width:3.25rem;height:3.25rem;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--color-accent-muted);color:var(--color-text-accent)}.vgate-ic svg{width:1.5rem;height:1.5rem}
.vgate input[type=password]{width:100%;min-height:var(--h-l);height:var(--h-l);font:inherit;font-size:1rem;color:var(--color-text-primary);background:var(--color-background-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-element);padding:0 .75rem;box-sizing:border-box;text-align:center}
.vgate input[type=password]:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 .1875rem var(--ring)}
.vgate-keep{display:flex;align-items:center;justify-content:center;gap:4px;font-size:var(--text-sm);color:var(--color-text-secondary)}
.vgate-err{color:var(--color-danger);font-size:var(--text-sm)}
.vgate-alt{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:var(--spacing-3);padding-top:var(--spacing-4);border-top:1px solid var(--color-border)}
.navfoot .vlock{width:100%;margin-bottom:8px}
/* ===== 模組（v43） ===== */
.mods{display:flex;flex-direction:column;gap:var(--spacing-3)}
.mod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--spacing-3) var(--spacing-4);align-items:center;padding:var(--spacing-4) var(--spacing-5);background:var(--color-background-surface);border:1px solid var(--color-border);border-radius:var(--radius-container)}
.mod.sub{padding:var(--spacing-3) 0 0;border:0;border-top:1px dashed var(--color-border);border-radius:0;background:none}
.mod-kids{grid-column:2/-1;display:flex;flex-direction:column;gap:var(--spacing-3)}
.mod-ic{width:var(--h-l);height:var(--h-l);border-radius:12px;display:grid;place-items:center;background:var(--color-accent-muted);color:var(--color-text-accent)}.mod-ic svg{width:1.25rem;height:1.25rem}
.mod.sub .mod-ic{width:var(--h-m);height:var(--h-m);border-radius:10px;background:var(--color-background-muted);color:var(--color-text-secondary)}
.mod-t{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.mod-t b{font-size:1.05rem}
.mod-t .chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-xs);padding:1px 8px;border-radius:999px;border:1px solid var(--color-border);color:var(--color-text-secondary)}
.mod-t .chip svg{width:.8rem;height:.8rem}.mod-t .chip.ok{color:var(--color-success);border-color:color-mix(in srgb,var(--color-success) 40%,transparent)}
.mod-t .chip.acc{color:var(--color-text-accent);border-color:var(--color-accent);background:var(--color-accent-muted)}
.mod-d{font-size:var(--text-sm);margin-top:2px}.mod-m{font-size:var(--text-xs);margin-top:2px}
.mod-err{color:var(--color-danger);font-size:var(--text-sm);margin-top:4px}
.mod-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mod-prog{position:relative;width:9rem;height:var(--h-m);border-radius:var(--radius-element);background:var(--color-background-muted);overflow:hidden;display:grid;place-items:center}
.mod-prog span{position:absolute;inset:0 auto 0 0;background:var(--color-accent-muted);transition:width .2s}.mod-prog b{position:relative;font-size:var(--text-sm)}
.mod-welcome{position:relative;margin-bottom:var(--spacing-4);padding:var(--spacing-6)}
.mod-welcome h2{margin:0 0 6px;font-size:1.25rem}.mod-welcome p{margin:0 0 8px}.mod-welcome ul{margin:0 0 var(--spacing-4);padding-left:1.2em;color:var(--color-text-secondary);font-size:var(--text-sm);line-height:1.8}
.mod-x{position:absolute;top:10px;right:10px}
.mod-key{margin-bottom:var(--spacing-4)}.vgate.compact{margin:0 auto;padding:var(--spacing-5)}
.mod-foot{margin-top:var(--spacing-4);font-size:var(--text-sm)}
.mod-ask-wrap{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:rgba(0,0,0,.35);padding:16px}
.mod-ask{max-width:26rem;width:100%;padding:var(--spacing-6)}.mod-ask h2{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:1.15rem}.mod-ask .mod-acts{margin-top:var(--spacing-4)}
.navi .dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);margin-left:auto}
@media(max-width:899px){.mod{grid-template-columns:auto minmax(0,1fr);padding:var(--spacing-4)}.mod>.mod-acts,.mod>.mod-prog,.mod>button{grid-column:1/-1;justify-content:stretch}.mod>button.b{width:100%}.mod-kids{grid-column:1/-1}}
.mod>.mod-acts>*{flex:1}
.linkb{border:0;background:none;padding:0;font:inherit;color:var(--color-text-accent);text-decoration:underline;cursor:pointer}
.mod-inst{margin-bottom:var(--spacing-4);display:flex;flex-direction:column;gap:var(--spacing-3)}
.mod-drop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mod-drop.big{justify-content:center;padding:var(--spacing-6) var(--spacing-4);border:2px dashed var(--color-border-strong);border-radius:var(--radius-container);transition:background .15s,border-color .15s}
.mod-drop.big.over{border-color:var(--color-accent);background:var(--color-accent-muted)}
.mod-sig{display:flex;align-items:center;gap:6px;margin:0;font-size:var(--text-sm)}.mod-sig svg{width:1rem;height:1rem;flex:none}
.mod-ok{color:var(--color-success);font-size:var(--text-sm)}
.mod-err{white-space:pre-line}
.mod.off .mod-ic{opacity:.55}
.mod-welcome ol{margin:0 0 var(--spacing-3);padding-left:1.3em;line-height:1.9}
.mod-upd{margin:0 0 var(--spacing-3);font-size:var(--text-sm)}
.mod-ask .mod-acts{align-items:center}
.vgate h2{text-align:center;justify-content:center;align-self:center;width:100%}
.mod-ask .vgate.compact{border:0;box-shadow:none;padding:0;margin:var(--spacing-3) 0 0;background:none;max-width:none}
.key-note{margin:0}
.mod-t .chip.warn{color:var(--color-warning,#b7791f);border-color:color-mix(in srgb,var(--color-warning,#b7791f) 45%,transparent)}
.navfoot .navmods{display:flex;gap:8px;margin-bottom:8px}.navfoot .navmods .b{flex:1}
.navi .dot,.navmods .dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);display:inline-block}
.shell .railonly{display:none}.shell.rail .railonly{display:grid;position:relative}.shell.rail .railfirst{margin-top:auto}
.shell.rail .railfirst~.railtheme{margin-top:0}
.shell.rail .railonly .dot{position:absolute;top:8px;right:8px}
.hn{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px;font-size:1rem}.hn>svg{width:1.05rem;height:1.05rem;color:var(--color-warning,#b7791f);flex:none}
.hchip{display:inline-flex;align-items:center;gap:1px;padding:2px 10px;border-radius:999px;background:var(--color-background-muted);border:1px solid var(--color-border);font-size:1.05rem;letter-spacing:.08em}
.hchip b{font-weight:700;color:var(--color-text-primary)}.hchip .hm{color:var(--color-text-secondary);opacity:.7}
.hplus{font-style:normal;color:var(--color-text-secondary);margin:0 6px 0 -2px;letter-spacing:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.out .keys{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.alts{margin-top:var(--spacing-3);border:1px solid var(--color-border);border-radius:var(--radius-element);padding:8px 12px;background:var(--color-background-surface)}
.alts summary{cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600}.alts summary svg{color:var(--color-success);width:1rem;height:1rem}
.alts>div{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.achip{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--color-success) 40%,transparent);background:color-mix(in srgb,var(--color-success) 8%,transparent);font-size:.95rem}
</style>
