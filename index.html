/* ---------- practice ---------- */
#t-practice{display:grid;grid-template-columns:minmax(0,1fr) 15.5rem;gap:var(--spacing-4);align-items:start}
#t-practice>aside{position:sticky;top:var(--spacing-6);order:2;max-height:calc(100vh - 3rem);overflow:auto}
#t-practice.rv>aside,.rv #minlbox{display:none}
@media(max-width:1099px){#t-practice{grid-template-columns:1fr}#t-practice>aside{position:static;max-height:none}}
.pcard{padding:var(--spacing-6)}
.pmeta{display:flex;flex-wrap:wrap;gap:0.375rem;justify-content:center}
.stat{display:inline-flex;align-items:center;gap:0.375rem;padding:0.1875rem 0.625rem;border-radius:var(--radius-full);background:var(--color-background-muted);color:var(--color-text-secondary);font-size:var(--text-xs);font-weight:550}
.stat b{color:var(--color-text-primary)}
.bx{margin:var(--spacing-5) 0!important}
.bx>.mu:first-child,.slbl{display:inline-block;margin-bottom:0.375rem;padding:1px 0.5625rem;border-radius:var(--radius-full);background:var(--color-accent-muted);color:var(--color-text-accent);font-size:var(--text-xs);font-weight:600}
.out{margin-top:0.5rem;padding:0.75rem 0.875rem;border-radius:var(--radius-element);background:var(--color-background-muted)}
.out .ans{margin:0.5rem 0 0.25rem}
.verdict{display:inline-flex;align-items:center;gap:0.3125rem;font-weight:650}.verdict svg{width:1.125rem;height:1.125rem}
.gw{display:inline-flex;align-items:center;gap:0.1875rem;margin:2px 0.5rem 2px 0;font-size:var(--text-sm)}
.out .toolbar{margin-top:0.5rem}
.actbar{display:flex;flex-wrap:wrap;gap:var(--spacing-2);align-items:center;margin-top:var(--spacing-5);padding-top:var(--spacing-4);border-top:1px solid var(--color-border)}
.actbar .grow{flex:1}
.actbar .hint{font-size:var(--text-xs);color:var(--color-text-secondary);display:inline-flex;gap:0.25rem;align-items:center}
#minlbox{margin-top:var(--spacing-3);display:flex;flex-wrap:wrap;align-items:center;gap:0.25rem}
#minlbox input{width:3.4em;min-height:2rem;padding:2px 0.375rem;text-align:center}
#rel{margin-top:var(--spacing-5);padding-top:var(--spacing-4);border-top:1px dashed var(--color-border)}
.recent{display:flex;flex-direction:column;gap:2px;margin-top:0.375rem}
.recent details{margin:0;border-radius:var(--radius-inner)}
.recent summary{list-style:none;display:flex;align-items:center;gap:0.5rem;padding:0.375rem 0.5rem;border-radius:var(--radius-inner);color:var(--color-text-primary);font-size:.95rem}
.recent summary::-webkit-details-marker{display:none}
.recent summary:hover{background:var(--color-background-hover)}
.recent summary svg{width:1rem;height:1rem;flex:none}
.recent details[open] summary{background:var(--color-background-muted)}
.recent details>.mu{padding:0.25rem 0.5rem 0.5rem}

/* ---------- gallery ---------- */
.filterbar{display:flex;gap:var(--spacing-2);align-items:center}
.filterbar .searchbox{flex:1}
.fbtn{position:relative}
.fbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--color-accent);color:var(--color-on-accent)}
.gf{margin:var(--spacing-3) 0 0;padding-top:var(--spacing-3);border-top:1px solid var(--color-border)}
.gfr{display:grid;gap:var(--spacing-2);margin-bottom:var(--spacing-2)}
@media(max-width:560px){.gfr{grid-template-columns:1fr 1fr!important}}
.gfi{display:flex;flex-direction:column;gap:0.25rem;min-width:0}
.gfi>span{font-size:var(--text-xs);font-weight:600;color:var(--color-text-secondary)}
.activef{display:flex;flex-wrap:wrap;gap:0.375rem;margin-top:var(--spacing-3)}
.fchip{display:inline-flex;align-items:center;gap:0.25rem;min-height:1.75rem;padding:0 0.375rem 0 0.625rem;border-radius:var(--radius-full);border:1px solid color-mix(in srgb,var(--color-accent) 40%,var(--color-border));background:var(--color-accent-muted);color:var(--color-text-accent);font:inherit;font-size:var(--text-xs);font-weight:600;cursor:pointer}
.fchip svg{width:0.875rem;height:0.875rem}
.fchip:hover{border-color:var(--color-accent)}
.gstat{display:flex;flex-wrap:wrap;gap:var(--spacing-2);align-items:center;margin:var(--spacing-3) 0 0}
.gact{display:flex;gap:0.375rem;align-items:center;flex-wrap:wrap}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.375rem,1fr));gap:var(--spacing-2)}
.tile{position:relative;background:var(--color-background-surface);border:1px solid var(--color-border);border-radius:var(--radius-container);padding:0.75rem 0.875rem;cursor:pointer;text-align:left;color:var(--color-text-primary);font:inherit;min-height:5.25rem;display:flex;flex-direction:column;gap:0.375rem;transition:border-color var(--duration-fast),box-shadow var(--duration-fast),transform var(--duration-fast) var(--ease-move)}
.tile b{font-size:1.2rem;letter-spacing:.03em;word-break:break-all}
.tile:hover{border-color:color-mix(in srgb,var(--color-accent) 55%,var(--color-border));box-shadow:var(--shadow-1);transform:translateY(-1px)}
.chip{display:inline-flex;align-items:center;font-size:.74rem;line-height:1.6;padding:0 .6em;border-radius:var(--radius-full);border:1px solid transparent;background:var(--color-background-muted);color:var(--color-text-secondary);margin:2px 0.25rem 0 0;white-space:nowrap;text-decoration:none}
a.chip{color:var(--color-text-accent);border-color:var(--color-border);font-size:.85rem;padding:2px .75em}a.chip:hover{background:var(--color-accent-muted)}
.chip.n{color:var(--color-danger);background:var(--color-danger-muted)}.chip.p{color:var(--color-success);background:var(--color-success-muted)}
.chip.id{color:var(--color-warning);background:color-mix(in srgb,var(--color-warning) 14%,transparent)}
#gdet .dhead{display:flex;justify-content:space-between;align-items:center;gap:0.5rem;margin-bottom:0.25rem}
.tg{display:grid;grid-template-columns:6em 1fr;gap:0.375rem 0.625rem;margin:var(--spacing-3) 0;padding:0.75rem 0.875rem;border-radius:var(--radius-element);background:var(--color-background-muted)}
.tg>div:nth-child(odd){color:var(--color-text-secondary);font-size:var(--text-xs);font-weight:600;padding-top:0.1875rem}
.tg .chip{background:var(--color-background-surface)}
.sec{margin-top:var(--spacing-6)}.sec>h3{font-size:.95rem;margin:0 0 .5em;color:var(--color-text-accent);display:flex;align-items:center;gap:0.5rem}
.sec>h3::after{content:"";flex:1;height:1px;background:var(--color-border)}
.raw{white-space:pre-wrap;overflow-wrap:anywhere;margin:0.375rem 0;line-height:1.75}.raw u{text-decoration:underline;text-underline-offset:0.1875rem}
.imgs img{max-width:100%;border-radius:var(--radius-element);display:block;margin:0.375rem 0;border:1px solid var(--color-border)}

/* ---------- combobox ---------- */
.cb{position:relative}
.cb input{width:100%;min-height:var(--size-element-md);padding:0.375rem 1.875rem 0.375rem 0.625rem;font-size:0.9375rem}
.cb.set input{border-color:var(--color-accent);background:var(--color-accent-muted)}
.cbx{position:absolute;right:0.25rem;top:50%;transform:translateY(-50%);min-height:1.75rem!important;width:1.75rem;border:0;background:transparent;color:var(--color-text-secondary);cursor:pointer;border-radius:0.5rem;font-size:0.9375rem;padding:0}
.cbx:hover{background:var(--color-background-hover);color:var(--color-text-primary)}
.cbl{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 0.25rem);max-height:18.75rem;overflow:auto;background:var(--color-background-surface);border:1px solid var(--color-border);border-radius:var(--radius-container);box-shadow:var(--shadow-2);padding:0.25rem;display:none;min-width:13.75rem}
.cb.open .cbl{display:block}
.cbo{display:flex;justify-content:space-between;gap:0.5rem;padding:0.5rem 0.625rem;border-radius:0.5rem;cursor:pointer;font-size:.92rem;color:var(--color-text-primary)}
.cbo small{color:var(--color-text-secondary);flex:none}.cbo.act{background:var(--color-background-hover)}.cbo.sel{color:var(--color-text-accent);font-weight:600}.cbo mark{background:none;color:var(--color-text-accent);font-weight:700}
.cbo.zero{opacity:.45}

/* ---------- room ---------- */
.rhead{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;margin-bottom:0.5rem}
.rhead .ttl{display:flex;align-items:center;gap:0.5rem;font-weight:650;min-width:0;text-align:center;flex-wrap:wrap;justify-content:center}
.rtb{display:flex;gap:0.375rem;align-items:center;flex-wrap:wrap;margin-top:0.625rem}
.rtb .grow{flex:1}
#rc{border:1px solid var(--color-border)}

/* ---------- import/edit/sent rows ---------- */
.dropzone{display:flex;flex-direction:column;align-items:center;gap:0.5rem;padding:var(--spacing-6);border:2px dashed var(--color-border-strong);border-radius:var(--radius-container);text-align:center;color:var(--color-text-secondary);transition:border-color var(--duration-fast),background var(--duration-fast)}
.dropzone.over{border-color:var(--color-accent);background:var(--color-accent-muted)}
.dropzone svg{width:1.875rem;height:1.875rem;color:var(--color-text-accent)}
.sticky-act{position:sticky;top:0;z-index:5;background:var(--color-background-surface);padding:0.5rem 0;margin:-4px 0 0.25rem;border-bottom:1px solid var(--color-border)}
@media(max-width:899px){.sticky-act{top:calc(3.0625rem + env(safe-area-inset-top,0px))}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(17.5rem,1fr));gap:var(--spacing-3)}
.grid2>.card{margin:0}
.sentrow{display:flex;gap:0.75rem;align-items:flex-start;justify-content:space-between}
.sentrow>div:first-child{min-width:0}

@media(max-width:560px){.card{padding:var(--spacing-4)}.pcard{padding:var(--spacing-4)}.word{margin:var(--spacing-2) 0 var(--spacing-3)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* v33 refinements */
.sidenav .seg button{padding:0 0.375rem;gap:0.25rem;font-size:.8rem;white-space:nowrap}
.efields{display:grid;grid-template-columns:1fr 1fr;gap:0.375rem}
@media(max-width:560px){.efields{grid-template-columns:1fr}}
input.ew{font-size:1.1rem;font-weight:650;letter-spacing:.03em}
@media(hover:none){.actbar .hint,.searchbox kbd,.navfoot .mu{display:none}}
@media(max-width:899px){.searchbox kbd{display:none}}

/* v34: desktop UI at 125% (all sizes are rem) */
html{font-size:16px}
@media(min-width:900px){html{font-size:20px}}
.report{margin-top:var(--spacing-3, .75rem)}
.report .rtypes{border:0;padding:0;margin:8px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:4px 12px}
.report .rtypes legend{padding:0;margin-bottom:4px}
.report .rtypes label{display:flex;gap:6px;align-items:center;cursor:pointer;font-size:.92rem}
.report textarea{min-height:4.5rem}

/* v37: wider desktop content, larger 3D room, speech, sorting, motion */
@media(min-width:900px){
  .content{max-width:none;padding:var(--spacing-5) var(--spacing-6) 2.5rem}
  #t-practice{grid-template-columns:minmax(0,1fr) 15rem}
  #t-gallery>#gdet,#t-gallery>#sent,#t-gallery>.report{max-width:64rem}
  #t-gallery>#gdet,#t-gallery>#sent,#t-gallery>.report{margin-left:auto;margin-right:auto}
  #t-room .ph{margin-bottom:var(--spacing-2)}
  #rc{height:max(24rem,calc(100vh - 13.5rem))}
}
#rc{height:min(70vh,35rem)}
.speakrow{display:flex;justify-content:center;margin:-.5rem 0 .75rem}
.speak{display:inline-flex;flex-wrap:wrap;gap:.375rem;align-items:center;justify-content:center}
.speak .b.sm{min-height:2rem}
.speak .playing{background:var(--color-accent-muted);border-color:var(--color-accent);color:var(--color-text-accent)}
.speak .playing svg{animation:pulse 1s ease-in-out infinite}
.speaknote{flex-basis:100%;text-align:center;max-width:32rem;margin:.25rem auto 0;font-size:.8rem}
@keyframes pulse{50%{opacity:.45}}
.sortsel{position:relative;display:inline-flex;align-items:center}
.sortsel svg{position:absolute;left:.6rem;width:1rem;height:1rem;color:var(--color-text-secondary);pointer-events:none}
.sortsel select{width:auto;min-height:var(--size-element-sm);padding:.25rem 2rem .25rem 2rem;font-size:var(--text-sm);border-radius:var(--radius-element);background-image:linear-gradient(45deg,transparent 50%,var(--color-text-secondary) 50%),linear-gradient(135deg,var(--color-text-secondary) 50%,transparent 50%);background-position:calc(100% - 1rem) 55%,calc(100% - .7rem) 55%;background-size:.3rem .3rem;background-repeat:no-repeat;cursor:pointer}
.ghead{grid-column:1/-1;display:flex;align-items:center;gap:.5rem;margin:.75rem 0 .1rem;font-weight:650;color:var(--color-text-accent);font-size:.95rem}
.ghead:first-child{margin-top:0}
.ghead::after{content:"";flex:1;height:1px;background:var(--color-border)}
.tdate{font-size:.72rem;color:var(--color-text-secondary);margin-top:auto}
.gal{grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr))}
.tile:active{transform:scale(.97)}
.b:active:not(:disabled){transform:translateY(1px)}

/* v38: collapsible side nav, centred practice, full-height room, voice picker, roomier gallery */
.brand{padding-right:0}
.navclose{margin-left:auto}
.navopen{display:none}
@media(min-width:900px){
  .shell.navoff{grid-template-columns:minmax(0,1fr)}
  .shell.navoff .sidenav{display:none}
  .navopen{display:inline-flex;position:fixed;top:.75rem;left:.75rem;z-index:35;box-shadow:var(--shadow-1)}
  .shell.navoff .content{padding-left:4.25rem}
  .content:has(#t-room){padding-top:var(--spacing-3);padding-bottom:var(--spacing-3)}
  #t-room .ph{display:none}
  #t-room .roomcard{height:calc(100vh - 2 * var(--spacing-3));height:calc(100dvh - 2 * var(--spacing-3));display:flex;flex-direction:column;margin:0;padding:.6rem}
  #t-room .roomcard #rc{flex:1 1 auto;min-height:0;height:auto}
  .shell.navoff #t-room .rhead{padding-left:3.25rem}
}
.roomcard.full{position:fixed;inset:0;z-index:60;margin:0;border-radius:0;border:0;height:100vh!important;height:100dvh!important;display:flex;flex-direction:column;padding:.6rem}
.roomcard.full #rc{flex:1 1 auto;min-height:0;height:auto}
.roomcard:fullscreen{background:var(--color-background-surface)}
.rhead .toolbar{flex-wrap:nowrap}

.speak{position:relative}
.vpanel{position:absolute;z-index:40;top:calc(100% + .4rem);left:50%;transform:translateX(-50%);width:min(30rem,92vw);display:flex;flex-direction:column;gap:.75rem;padding:1rem;text-align:left;background:var(--color-background-surface);border:1px solid var(--color-border);border-radius:var(--radius-container);box-shadow:var(--shadow-2)}
.vpanel select{font-size:.9rem}
.vpanel .mu{font-size:.78rem;line-height:1.5}

.gal.cozy{grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.75rem}
.gal.cozy .tile{padding:1rem 1.1rem;min-height:8.75rem;gap:.4rem}
.gal.cozy .tile b{font-size:1.35rem;line-height:1.3}
.tmean{color:var(--color-text-secondary);font-size:.86rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tchips{margin-top:auto;display:flex;flex-wrap:wrap;gap:0 .1rem}
.gal.dense{grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.5rem}
.gstat .seg button{min-height:2rem;padding:0 .65rem;font-size:.82rem}
@media(max-width:560px){.gstat .seg span{display:none}.gal.cozy{grid-template-columns:1fr 1fr;gap:.5rem}.gal.cozy .tile{padding:.75rem;min-height:7.5rem}.gal.cozy .tile b{font-size:1.15rem}}

/* v38: practice card centred on the page; 最近作答 in the right gutter only when the content area is wide enough */
@media(min-width:900px){
  .content{container-type:inline-size}
  .shell.navoff .content{padding-right:4.25rem}
  .shell.navoff .content:has(#t-room){padding-left:var(--spacing-6);padding-right:var(--spacing-6)}
  #t-practice{grid-template-columns:minmax(0,56rem);justify-content:center}
  #t-practice>aside{position:static;max-height:none;order:2}
  .content:has(#t-practice) .ph{max-width:56rem;margin-inline:auto}
}
@container (min-width: 76rem){
  #t-practice:not(.rv){grid-template-columns:minmax(15rem,1fr) minmax(0,56rem) minmax(15rem,1fr);column-gap:var(--spacing-5)}
  #t-practice:not(.rv)>div{grid-column:2;grid-row:1}
  #t-practice:not(.rv)>aside{grid-column:3;grid-row:1;width:15rem;justify-self:start;position:sticky;top:var(--spacing-6)}
  .content:has(#t-practice:not(.rv)) .ph{max-width:min(56rem,calc(100cqw - 30rem - 2 * var(--spacing-5)))}
}
.navfoot .mu{line-height:1.9}

/* ---------- 寫作 ---------- */
/* sizes: L 48 · M 40 · S 32 (phones one step up: 52 · 44 · 36) */
#t-write,.wr-dlg,.wr-drawer-wrap,.wr-menu,.wr-fnpop,.wr-mbar-wrap{--h-l:48px;--h-m:40px;--h-s:32px;--fz-l:17px;--fz-m:16px;--fz-s:15px;--wr-serif:"Noto Serif TC","Source Han Serif TC","Source Han Serif","思源宋體","Noto Serif CJK TC","Songti TC","PMingLiU",serif;font-size:16px}
@media(max-width:899px){#t-write,.wr-dlg,.wr-drawer-wrap,.wr-menu,.wr-fnpop,.wr-mbar-wrap{--h-l:52px;--h-m:44px;--h-s:36px;--fz-l:17px;--fz-m:16px;--fz-s:15px}}
.content:has(#t-write){max-width:none;padding-top:20px}
.shell.rail{grid-template-columns:76px minmax(0,1fr)}
.shell.rail .sidenav{padding:16px 10px;align-items:center}
.shell.rail .sidenav .brand{padding:4px 0 10px}.shell.rail .sidenav .brand>div,.shell.rail .navclose,.shell.rail .navgrp,.shell.rail .navi .lbl,.shell.rail .navi kbd,.shell.rail .navi .badge,.shell.rail .navfoot{display:none}
.shell.rail .navi{width:52px;height:52px;padding:0;justify-content:center}.shell.rail .navi svg{width:24px;height:24px}

.wr-b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h-m);padding:0 16px;border:1px solid var(--color-border);border-radius:10px;background:var(--color-background-surface);color:var(--color-text-primary);font:inherit;font-size:var(--fz-m);font-weight:500;cursor:pointer;white-space:nowrap;transition:background var(--duration-fast),border-color var(--duration-fast)}
.wr-b svg{width:18px;height:18px;flex:none}
.wr-b:hover:not(:disabled){background:var(--color-background-hover)}
.wr-b:disabled{opacity:.5;cursor:default}
.wr-b.l{height:var(--h-l);padding:0 20px;border-radius:12px;font-size:var(--fz-l)}
.wr-b.s{height:var(--h-s);padding:0 12px;border-radius:8px;font-size:var(--fz-s)}
.wr-b.icon{width:var(--h-m);padding:0}.wr-b.l.icon{width:var(--h-l)}.wr-b.l.icon svg{width:20px;height:20px}
.wr-b.pri{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent);font-weight:600}.wr-b.pri:hover:not(:disabled){background:var(--color-accent-hover)}
.wr-b.soft{background:var(--color-accent-muted);border-color:transparent;color:var(--color-text-accent);font-weight:600}
.wr-b.ghost{background:transparent;border-color:transparent;color:var(--color-text-secondary)}.wr-b.ghost:hover:not(:disabled){color:var(--color-text-primary)}
.wr-b.danger{color:var(--color-danger);border-color:color-mix(in srgb,var(--color-danger) 40%,var(--color-border))}.wr-b.danger:hover{background:var(--color-danger-muted)}
.wr-b.armed{background:var(--color-danger);border-color:var(--color-danger);color:#fff;width:auto;padding:0 12px}
.wr-in{width:100%;box-sizing:border-box;min-height:0;height:var(--h-m);border:1px solid var(--color-border-strong);border-radius:10px;padding:0 12px;font:inherit;font-size:var(--fz-m);color:var(--color-text-primary);background:var(--color-background-surface)}
.wr-in.l{height:var(--h-l);border-radius:12px;padding:0 14px;font-size:18px}
textarea.wr-in{height:auto;padding:10px 12px;line-height:1.7;resize:vertical;min-height:0}
.wr-in:focus,.wr-sel:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 3px var(--ring)}
.wr-sel{width:160px;min-height:0;height:var(--h-m);-webkit-appearance:none;appearance:none;padding-right:32px!important;background-image:linear-gradient(45deg,transparent 50%,var(--color-text-secondary) 50%),linear-gradient(135deg,var(--color-text-secondary) 50%,transparent 50%)!important;background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%!important;background-size:5px 5px!important;background-repeat:no-repeat!important;cursor:pointer;border:1px solid var(--color-border-strong);border-radius:10px;padding:0 10px;font:inherit;font-size:var(--fz-m);color:var(--color-text-primary);background:var(--color-background-surface)}
.wr-seg{display:inline-flex;align-items:center;height:var(--h-m);box-sizing:border-box;padding:4px;gap:2px;background:var(--color-background-muted);border-radius:12px;flex:none}
.wr-seg.l{height:var(--h-l);border-radius:14px}.wr-seg.s{height:var(--h-s);padding:3px;border-radius:10px}
.wr-seg button{position:relative;height:100%;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--color-text-secondary);font:inherit;font-size:var(--fz-s);font-weight:500;cursor:pointer;white-space:nowrap}
.wr-seg.l button{padding:0 16px;border-radius:10px;font-size:var(--fz-l)}.wr-seg.s button{padding:0 8px;border-radius:7px}
.wr-seg button.on{color:var(--color-text-primary);font-weight:600}
.wr-pill{position:absolute;inset:0;border-radius:inherit;background:var(--color-background-surface);box-shadow:0 1px 2px rgba(30,40,30,.14)}

.wr-chip-b{display:inline-flex;align-items:center;gap:6px;height:var(--h-s);padding:0 12px;border:0;border-radius:999px;background:var(--color-accent-muted);color:var(--color-text-accent);font:inherit;font-size:14px;cursor:pointer}

.wr-pillb{height:var(--h-s);padding:0 12px;border:1px solid var(--color-border);border-radius:999px;background:var(--color-background-surface);color:var(--color-text-primary);font:inherit;font-size:var(--fz-s);cursor:pointer}

.wr-chk{display:inline-flex;align-items:center;gap:8px;height:var(--h-m);font-size:var(--fz-m);cursor:pointer}

.wr-line{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}.wr-line.wrap{flex-wrap:wrap;gap:8px}.wr-line .grow,.wr-acts .grow,.wr-tb .grow,.wr-foot .grow,.wr-exp-h .grow,.wr-exp-f .grow{flex:1}

/* header */

/* body */

.wr-tool{position:relative;display:inline-grid;place-items:center;width:var(--h-m);height:var(--h-m);padding:0;border:0;border-radius:10px;background:transparent;color:var(--color-text-primary);cursor:pointer;font:inherit}

.wr-tool svg{width:20px;height:20px}
.wr-tool:hover:not(:disabled){background:var(--color-background-hover)}
.wr-tool[aria-pressed=true]{color:var(--color-text-accent)}
.wr-tool-on{position:absolute;inset:0;border-radius:inherit;background:var(--color-accent-muted);z-index:0}
.wr-tool:disabled{opacity:.35;cursor:default}
.wr-emi{font-size:16px;text-emphasis:filled dot;-webkit-text-emphasis:filled dot;text-emphasis-position:under right;-webkit-text-emphasis-position:under;line-height:1}
.wr-rubyi{font-size:15px;line-height:1}.wr-rubyi rt{font-size:8px}
.wr-tool.aa{font-weight:700;font-size:16px;background:var(--color-background-muted)}.wr-tool.aa.on{background:var(--color-accent);color:var(--color-on-accent)}

/* page */
.wr-page{width:100%;max-width:920px;margin:0 auto;padding:44px 72px 28px;box-sizing:border-box;font-family:var(--wr-serif);flex:1}

.wr-prose{outline:none;font-family:var(--wr-serif);font-size:calc(22px * var(--wr-fs,1));line-height:var(--wr-lh,2);min-height:20rem;color:var(--wr-ink,var(--color-text-primary));overflow-wrap:anywhere;line-break:strict;counter-reset:fn}
.wr-prose:focus,.wr-prose:focus-visible{outline:none}

.wr-prose a{color:var(--color-text-accent)}
.wr-prose mark{border-radius:3px;padding:0 1px;color:inherit}
.wr-prose .wr-em{text-emphasis:filled dot;-webkit-text-emphasis:filled dot;text-emphasis-position:under right;-webkit-text-emphasis-position:under}
.wr-prose .wr-fnref{counter-increment:fn;cursor:pointer;color:var(--color-text-accent);font-family:var(--font-family-body);font-weight:700;font-size:.6em;padding:0 .12em;border-radius:4px}
.wr-prose .wr-fnref::after{content:counter(fn)}
.wr-prose .wr-fnref:hover,.wr-prose .wr-fnref.ProseMirror-selectednode{background:var(--color-accent-muted)}
.wr-prose ruby{ruby-position:over}.wr-prose rt{font-size:.45em;color:var(--color-text-secondary)}

.wr-prose p.is-editor-empty:first-child::before{content:attr(data-placeholder);float:left;height:0;pointer-events:none;color:color-mix(in srgb,var(--color-text-secondary) 60%,transparent);text-indent:0}
.wr-page.wr-v{max-width:none;padding:32px 40px 24px}

.wr-bar{width:120px;height:6px;border-radius:3px;background:var(--color-background-muted);overflow:hidden}.wr-bar span{display:block;height:100%;background:var(--color-accent);border-radius:3px}
.wr-saved i{width:9px;height:9px;border-radius:50%;background:var(--color-success)}.wr-saved i.d{background:var(--color-warning)}
.wr-focus .wr-docs{display:none}.wr-focus .wr-body{grid-template-columns:minmax(0,1fr)}
#t-write.wr-focus{background:var(--color-background-body);padding:20px 28px;overflow:auto}

/* menus & popovers */

/* dialogs & drawer */
.wr-dlg{border:0;padding:0;background:transparent;max-width:min(560px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 32px);overflow:visible;color:var(--color-text-primary)}

.wr-small{display:flex;flex-direction:column;gap:12px;padding:22px 24px}
.wr-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wr-ruby-prev{font-family:var(--wr-serif);font-size:32px;text-align:center;padding:8px 0}.wr-ruby-prev rt{font-size:.45em;color:var(--color-text-secondary)}

.wr-wl li:last-child{border-bottom:0}.wr-wl li[aria-selected=true]{background:var(--color-accent-muted)}
.wr-wl li b{font-family:var(--wr-serif);font-size:18px;flex:none}.wr-wl li span{color:var(--color-text-secondary);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr-drawer-wrap{position:fixed;inset:0;z-index:80}
.wr-scrim{position:absolute;inset:0;background:rgba(20,24,20,.3)}
.wr-drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--color-background-surface);border-left:1px solid var(--color-border);box-shadow:-8px 0 32px rgba(20,30,20,.14);display:flex;flex-direction:column}
.wr-dr-h{display:flex;align-items:center;gap:10px;padding:16px 16px 12px 20px;border-bottom:1px solid var(--color-border)}
.wr-dr-h svg:first-child{width:22px;height:22px;color:var(--color-text-accent)}.wr-dr-h h2{flex:1;margin:0;font-size:22px}
.wr-dr-note{display:flex;align-items:center;gap:8px;padding:10px 20px;font-size:14px;color:var(--color-text-secondary);border-bottom:1px solid var(--color-border)}.wr-dr-note svg{width:14px;height:14px}
.wr-dr-list{flex:1;min-height:0;overflow:auto;padding:8px 12px 320px}

.wr-ver{position:relative;width:100%;display:flex;align-items:center;gap:12px;height:52px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--color-text-primary);font:inherit;text-align:left;cursor:pointer}
.wr-ver:hover{background:var(--color-background-hover)}
.wr-ver>*:not(.wr-ver-pill){position:relative}
.wr-ver-pill{position:absolute;inset:0;border-radius:12px;background:var(--color-accent-muted)}
.wr-ver b{font-size:17px;min-width:52px}.wr-ver-k{flex:1;font-size:14px;color:var(--color-text-secondary)}.wr-ver-d{font-size:14px;font-weight:600;color:var(--color-success)}.wr-ver-d.neg{color:var(--color-danger)}
.wr-dr-cmp{position:absolute;left:16px;right:16px;bottom:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:var(--color-background-surface);border:1px solid var(--color-border);border-radius:16px;box-shadow:0 -4px 24px rgba(20,30,20,.10),0 8px 24px rgba(20,30,20,.12)}
.wr-dr-cmp-h{font-size:14px;color:var(--color-text-secondary)}.wr-dr-cmp-h b{color:var(--color-text-primary);font-size:15px}

.wr-dr-cmp .wr-acts>.wr-b{flex:1}

/* export */
.wr-exp{padding:0;display:flex;flex-direction:column;height:100%}

.wr-exp-b{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,720px) minmax(0,1fr)}
.wr-exp-opts{overflow:auto;padding:20px 24px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px 12px;align-items:center;align-content:start;border-right:1px solid var(--color-border)}
.wr-lab{font-size:14px;font-weight:600;color:var(--color-text-secondary)}.wr-lab.top{align-self:start;padding-top:10px}
.wr-exp-opts .wr-seg{justify-self:start}
.wr-fonts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wr-font{height:64px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 12px;border:1px solid var(--color-border);border-radius:10px;background:var(--color-background-surface);color:var(--color-text-primary);cursor:pointer;font:inherit}
.wr-font span{font-size:18px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%}.wr-font small{font-size:12px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wr-font.on{background:var(--color-accent-muted);border-color:var(--color-accent)}
.wr-sig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wr-at{position:relative;display:block}.wr-at>span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-text-secondary);pointer-events:none}.wr-at input{padding-left:30px}
.wr-sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--color-border-strong)}

.wr-htmlprev{background:#fff;color:#2a2520;font-size:15px;line-height:1.9;padding:22px 26px;border-radius:6px;box-shadow:var(--shadow-1);width:100%;max-width:520px;max-height:100%;overflow:auto;box-sizing:border-box}
.wr-htmlprev h1{font-size:22px;margin:0 0 12px}.wr-htmlprev p{margin:0 0 .6em;text-indent:2em}
.wr-exp-f{display:flex;gap:12px;align-items:center;padding:14px 24px;border-top:1px solid var(--color-border)}

/* lock & settings */
.wr-lock{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1080px;margin:16px auto}
.wr-lockcard{display:flex;flex-direction:column;align-items:center;gap:16px;padding:48px 40px;margin:0;border-radius:20px;text-align:center;min-height:440px}

.wr-lockform{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}

.wr-facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px}

/* =====================================================================
   v41.2 尺寸規範（全站）：大 L／中 M／小 S
   電腦 48／40／32px，手機 52／44／36px（與寫作分頁相同）
   L：一般按鈕、輸入框、下拉選單、分段選擇、搜尋框、側欄項目
   M：.sm 按鈕、次要分段選擇（統計列、側欄外觀）、表格內的小選單

button.b.xs,a.b.xs{min-height:var(--h-s);height:var(--h-s);padding:0 .5rem;font-size:var(--text-xs)}
button.b.icon{width:var(--h-l);padding:0}button.b.sm.icon{width:var(--h-m)}button.b.xs.icon{width:var(--h-s)}
:is(input[type=text],input[type=search],input[type=number],input[type=date],input.search,select):not(.wr-in):not(.wr-sel){min-height:var(--h-l);height:var(--h-l);padding-top:0;padding-bottom:0}

.searchbox input{min-height:var(--h-l);height:var(--h-l)}
.cb input{min-height:var(--h-l);height:var(--h-l)}
.sortsel select{min-height:var(--h-l);height:var(--h-l)}
input[type=file]::file-selector-button{height:var(--h-m);padding:0 .875rem}
.seg{height:var(--h-l);box-sizing:border-box;align-items:stretch}
.seg button{min-height:0;height:auto}
.gstat .seg,.sidenav .seg,.sheet .seg{height:var(--h-m)}
.gstat .seg button{min-height:0}
.navi{min-height:var(--h-l)}
.sheet .navi{min-height:var(--h-l)}
/* 寫作分頁的 .wr-* 控制項用同一組 --h-l/m/s，各自指定大小 */
.gstat .sortsel select,.gstat select{min-height:var(--h-m);height:var(--h-m)}
.addw{margin-bottom:var(--spacing-4)}

/* 全頁模組（大綱）：網站的側欄、頂欄、底欄讓位，模組自己畫外框 */

[data-resize-handle="right"],[data-resize-handle="left"]{cursor:ew-resize;width:6px;height:auto}[data-resize-handle="top"],[data-resize-handle="bottom"]{cursor:ns-resize;height:6px;width:auto}
